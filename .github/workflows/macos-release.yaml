name: macOS Release

on:
  push:
    branches:
      - trunk
    tags:
      - v*

env:
  PROG: cubiomes-viewer
  SOURCE_DIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt arm64
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '6.11.2'
          arch: 'clang_64'
          target: 'desktop'
          modules: 'qtbase qttools'
          cache: true

      - name: Build arm64
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          qmake CONFIG+=release QMAKE_APPLE_DEVICE_ARCHS=arm64 ${SOURCE_DIR}
          make clean
          make -j$(sysctl -n hw.ncpu)
          mv ${PROG}.app ${PROG}-arm64.app

      - name: Build x86_64
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          export CFLAGS="-arch x86_64 -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          export CXXFLAGS="-arch x86_64 -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          qmake CONFIG+=release QMAKE_APPLE_DEVICE_ARCHS=x86_64 ${SOURCE_DIR}
          make clean
          make -j$(sysctl -n hw.ncpu)
          mv ${PROG}.app ${PROG}-x86_64.app

      - name: Create universal app
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          mkdir -p ${PROG}.app/Contents/MacOS
          cp -R ${PROG}-arm64.app/Contents/Resources ${PROG}.app/Contents/
          cp ${PROG}-arm64.app/Contents/Info.plist ${PROG}.app/Contents/
          lipo -create \
            ${PROG}-arm64.app/Contents/MacOS/${PROG} \
            ${PROG}-x86_64.app/Contents/MacOS/${PROG} \
            -output ${PROG}.app/Contents/MacOS/${PROG}

      - name: Deploy
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          macdeployqt ${PROG}.app -dmg -no-plugins

      - name: Test
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          ./${PROG}.app/Contents/MacOS/${PROG} --version
          file ${PROG}.app/Contents/MacOS/${PROG}
          otool -L ${PROG}.app/Contents/MacOS/${PROG}

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROG }}-macos-universal
          path: ${{ env.SOURCE_DIR }}/${{ env.PROG }}.dmg
