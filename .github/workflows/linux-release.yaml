name: Linux Release

on:
  push:
    branches:
      - 'trunk'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'trunk'

defaults:
  run:
    shell: bash

env:
  PROG: cubiomes-viewer
  SOURCE_DIR: ${{ github.workspace }}

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
            deploy_arch: x86_64
          - arch: aarch64
            os: ubuntu-24.04-arm
            deploy_arch: aarch64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qt6-base-dev \
            qt6-base-dev-tools \
            qmake6 \
            libgl1-mesa-dev \
            libfuse2 \
            file \
            wget

      - name: Build
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          mkdir build && cd build
          qmake6 CONFIG+=release ..
          make -j$(nproc)

      - name: Bundle Qt and Package AppImage
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          ARCH_NAME="${{ matrix.deploy_arch }}"

          sudo wget -q -O /usr/local/bin/linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH_NAME}.AppImage"
          sudo wget -q -O /usr/local/bin/linuxdeploy-plugin-qt \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${ARCH_NAME}.AppImage"
          sudo wget -q -O /usr/local/bin/linuxdeploy-plugin-appimage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${ARCH_NAME}.AppImage"

          sudo chmod +x /usr/local/bin/linuxdeploy*

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp build/${{ env.PROG }} AppDir/usr/bin/

          cat <<EOF > AppDir/usr/share/applications/${{ env.PROG }}.desktop
          [Desktop Entry]
          Type=Application
          Name=Cubiomes Viewer
          Exec=${{ env.PROG }}
          Icon=${{ env.PROG }}
          Categories=Utility;
          Terminal=false
          EOF

          REPO_ICON=$(find . -maxdepth 3 -iname "*icon*.png" -o -iname "${{ env.PROG }}.png" | head -n 1)
          if [ -n "$REPO_ICON" ]; then
            cp "$REPO_ICON" AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.PROG }}.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.PROG }}.png
          fi

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=$(which qmake6)
          export ARCH=${ARCH_NAME}

          linuxdeploy \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/${{ env.PROG }}.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.PROG }}.png

          mv Cubiomes_Viewer-*.AppImage ${{ env.PROG }}-linux-${{ matrix.arch }}.AppImage 2>/dev/null || \
          mv *.AppImage ${{ env.PROG }}-linux-${{ matrix.arch }}.AppImage

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROG }}-linux-${{ matrix.arch }}
          path: ${{ env.SOURCE_DIR }}/${{ env.PROG }}-linux-${{ matrix.arch }}.AppImage
